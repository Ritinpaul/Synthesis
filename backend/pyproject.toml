[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "synthesis-backend"
version = "0.1.0"
description = "Synthesis autonomous codebase intelligence backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "numpy>=2.0.0",
  "pydantic-settings>=2.8.0",
  "PyJWT>=2.9.0",
  "sqlalchemy>=2.0.39",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "ruff>=0.11.0"
]
faiss = [
  "faiss-cpu>=1.9.0"
]
langgraph = [
  "langgraph>=0.2.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
