services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: synthesis
      POSTGRES_PASSWORD: synthesis
      POSTGRES_DB: synthesis
    ports:
      - "5435:5432"
    volumes:
      - synthesis_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6382:6379"

  backend:
    build:
      context: ./backend
    environment:
      SYNTHESIS_DATABASE_URL: postgresql+psycopg://synthesis:synthesis@postgres:5432/synthesis
      SYNTHESIS_JWT_SECRET: dev-secret
      SYNTHESIS_INDEX_DIR: /app/data/indexes
    volumes:
      - ./backend:/app
    ports:
      - "8010:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    ports:
      - "3010:3000"
    depends_on:
      - backend

volumes:
  synthesis_pg:
